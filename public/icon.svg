<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ivory" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.55" stop-color="#e9dcbd"/>
      <stop offset="1" stop-color="#b8a582"/>
    </radialGradient>
    <radialGradient id="obsidian" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#5a5a66"/>
      <stop offset="0.55" stop-color="#23232a"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3620"/>
      <stop offset="1" stop-color="#2a170c"/>
    </linearGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a25"/>
      <stop offset="1" stop-color="#141c18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background fills the whole canvas so the maskable crop has no transparent corners. -->
  <rect width="512" height="512" fill="#0c0b09"/>

  <!-- All artwork sits inside the central 80% safe zone required for maskable icons. -->
  <g transform="translate(51 51) scale(0.8)">
    <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#wood)"/>
    <rect x="34" y="34" width="444" height="444" rx="70" fill="url(#felt)"/>

    <!-- Four points, two of each colour, pointing inward. -->
    <polygon points="70,60 160,60 115,250" fill="#8a5231" opacity="0.75"/>
    <polygon points="176,60 266,60 221,250" fill="#d6bf95" opacity="0.5"/>
    <polygon points="282,60 372,60 327,250" fill="#8a5231" opacity="0.75"/>
    <polygon points="70,452 160,452 115,262" fill="#d6bf95" opacity="0.5"/>
    <polygon points="176,452 266,452 221,262" fill="#8a5231" opacity="0.75"/>
    <polygon points="282,452 372,452 327,262" fill="#d6bf95" opacity="0.5"/>

    <!-- Bar -->
    <rect x="388" y="34" width="56" height="444" fill="#2a170c"/>

    <!-- Two checkers, the game's two sides. -->
    <circle cx="200" cy="330" r="92" fill="url(#ivory)" filter="url(#shadow)"/>
    <circle cx="200" cy="330" r="58" fill="none" stroke="#7a6a4a" stroke-opacity="0.35" stroke-width="3"/>

    <circle cx="300" cy="190" r="92" fill="url(#obsidian)" filter="url(#shadow)"/>
    <circle cx="300" cy="190" r="92" fill="none" stroke="#5eead4" stroke-opacity="0.9" stroke-width="5"/>
    <circle cx="300" cy="190" r="58" fill="none" stroke="#5eead4" stroke-opacity="0.45" stroke-width="3"/>
  </g>
</svg>
